<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Local Community Event Portal</title>
        <style>
            body {
                background-color: white;
                margin: 0;
                padding: 0;
            }
            /* Navbar styling */
            nav {
                background-color: #4caf50; /* You can change this to any color you like */
                position: sticky;
                top: 0;
                z-index: 1000;
                display: flex;
                justify-content: center;
                gap: 2rem;
                padding: 1rem 0;
            }

            nav a {
                color: white;
                text-decoration: none;
                font-weight: bold;
                font-size: 1rem;
            }

            nav a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <!-- Navigation -->
        <nav>
            <a href="#home">Home</a>
            <a href="#events">Events</a>
            <a href="#contact">Contact</a>
            <a href="help.html" target="_blank">Help</a>
        </nav>

        <!-- Main -->
        <main>
            <section id="home">
                <h1>Welcome to the Local Community Event Portal</h1>
                <p>This is the home section of the portal.</p>
            </section>

            <section id="events">
                <h2>Upcoming Events</h2>
                <p>Here you can find upcoming events in your community.</p>
            </section>

            <section id="contact">
                <h2>Contact Us</h2>
                <p>Reach out to us for any queries or suggestions.</p>
            </section>
        </main>

        <!-- Footer -->
        <footer>
            <p>&copy; 2025 Local Community Portal</p>
        </footer>
    </body>
</html>
